[package]
name = "zenith"
description = "Zenith: clip library, editor and export"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "zenith-clips"
path = "src/main.rs"
test = false

[dependencies]
zenith-core = { path = "../crates/core" }
serde.workspace = true
serde_json.workspace = true
cxx = "1"
ureq = "3"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }

[features]
# SQLite built in, for systems that do not come with it (Windows).
bundled-sqlite = ["zenith-core/bundled-sqlite"]

# On Windows the program carries its icon inside it.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }
