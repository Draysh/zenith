[package]
name = "zenith-rec"
description = "Zenith's replay-buffer recorder for Windows: ffmpeg supervised, with the sound mixed in"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "zenith-rec"
path = "src/main.rs"

[dependencies]
thiserror.workspace = true
chrono.workspace = true
# Which programs are running, to find the voice apps' processes.
sysinfo = { version = "0.40", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
wasapi = "0.27"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
