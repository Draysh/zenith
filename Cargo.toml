[workspace]
resolver = "3"
members = ["crates/*", "app"]

[workspace.package]
version = "0.11.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rusqlite = "0.40"

[profile.release]
lto = "thin"
strip = true
panic = "abort"
